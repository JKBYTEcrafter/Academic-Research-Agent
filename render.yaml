services:
  - type: web
    name: academic-research-agent-api
    runtime: python
    rootDir: Agentic AI
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
